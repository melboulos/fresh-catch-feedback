<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎣 Fresh Catch</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: #fafafa; color: #0f172a; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 24px; }
  .card { background: white; border: 1px solid #e2e8f0; border-radius: 12px; padding: 40px 32px; max-width: 480px; width: 100%; box-shadow: 0 10px 30px rgba(0,0,0,0.06); text-align: center; }
  .emoji { font-size: 56px; margin-bottom: 12px; }
  h1 { margin: 0 0 8px 0; font-size: 22px; font-weight: 700; }
  p { margin: 8px 0; font-size: 15px; color: #475569; line-height: 1.5; }
  .highlight { font-weight: 600; color: #0f172a; }
  .status { font-size: 13px; color: #94a3b8; margin-top: 20px; }
</style>
</head>
<body>
<div class="card">
  <div class="emoji" id="emoji">🎣</div>
  <h1 id="title">Fresh Catch</h1>
  <p id="message">Click a button in your daily Fresh Catch email to record feedback or start a pursuit.</p>
  <p class="status" id="status"></p>
</div>
<script>
// ============================================================================
// Fresh Catch boomerang page.
// Two independent flows:
//   1. Feedback pills (👍 🔥 🚫 👎)
//      → POST directly to the Fresh Catch Feedback workflow webhook (unsigned).
//      → UNCHANGED from prior version.
//   2. Pursue action (🎯)
//      → POST to the Cloudflare Worker.
//      → Worker validates, resolves rep identity, injects booking_url,
//         signs the request, and forwards to the AUTHENTICATED Fresh Catch
//         Pursue webhook.
//      → No Rox signing secret ever touches this page.
// ============================================================================

// -- Endpoints --------------------------------------------------------------
const FEEDBACK_WEBHOOK_URL = 'https://webhooks.backend.rox.com/webhooks/w/workflow-webhook-003fa3e8';

// REPLACE THIS ONE LINE once the Cloudflare Worker for Fresh Catch Pursue is deployed.
const PURSUE_WORKER_URL = 'https://rox-deep-dive-proxy.mel-boulos-97e.workers.dev/fresh-catch-pursue';

// -- Query params -----------------------------------------------------------
const params = new URLSearchParams(window.location.search);

// Feedback pills carry `rating` (new) or `type` (legacy).
// Pursue carries `action=pursue`.
const action = params.get('action');
const rating = params.get('rating') || params.get('type');

const domain = params.get('domain');
const rep = params.get('rep');
const test = params.get('test');
const contactName = params.get('contact_name') || '';
const contactEmail = params.get('contact_email') || '';
const contactLinkedin = params.get('contact_linkedin') || '';
const pursuitId = params.get('pursuit_id');

// -- Feedback flow (UNCHANGED — do not modify) ------------------------------
const validRatings = ['good','bad','opportunity','not_relevant','dq_contact'];
const feedbackMessages = {
  good:         { emoji: '👍', title: 'Good account logged!',   body: 'Fresh Catch will find more companies like <span class="highlight">DOMAIN</span>.' },
  opportunity:  { emoji: '🔥', title: 'More like this logged!', body: 'Strongest positive signal we track. Nice work.' },
  not_relevant: { emoji: '🚫', title: 'Never suggest logged.',  body: '<span class="highlight">DOMAIN</span> won\'t be suggested again.' },
  dq_contact:   { emoji: '👎', title: 'Contact DQ\'d.',         body: '<span class="highlight">CONTACT</span> at <span class="highlight">DOMAIN</span> is out of the call list. Account stays on future lists — we\'ll try different contacts.' },
  bad:          { emoji: '👎', title: 'Feedback logged.',       body: 'Legacy button (no effect on future picks).' }
};

// -- Pursue flow ------------------------------------------------------------
function renderPursue() {
  const contactLabel = contactName || 'this contact';
  document.getElementById('emoji').textContent = '🎯';
  document.getElementById('title').textContent = 'Pursuit started';
  document.getElementById('message').innerHTML =
    'Drafting outreach for <span class="highlight">' + contactLabel + '</span>.<br>' +
    'Check your Rox Home in ~2 minutes.';
  document.getElementById('status').textContent = test === '1'
    ? 'Test click — nothing was drafted. You can close this tab.'
    : 'You can close this tab.';
}

function renderFeedback(m) {
  document.getElementById('emoji').textContent = m.emoji;
  document.getElementById('title').textContent = m.title;
  let bodyText = m.body.replace('DOMAIN', domain).replace('CONTACT', contactName);
  document.getElementById('message').innerHTML = bodyText;
  document.getElementById('status').textContent = test === '1'
    ? 'Test click — nothing was saved. You can close this tab.'
    : 'You can close this tab.';
}

// -- Route the click --------------------------------------------------------
if (action === 'pursue') {
  // Pursue: minimal payload — pursuit_id is the LOOKUP KEY, not proof of identity.
  // The Worker will resolve/validate rep identity server-side before forwarding.
  // The Pursue workflow will re-validate that pursuit_id.rep_email == payload.rep_email.
  if (pursuitId && rep) {
    const payload = { pursuit_id: pursuitId, rep_email: rep };
    if (contactEmail) payload.contact_email = contactEmail;
    if (test) payload.test = test;

    fetch(PURSUE_WORKER_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(payload)
    }).catch(function(){});

    renderPursue();
  }
} else if (rating && validRatings.includes(rating) && domain && rep) {
  // Feedback: existing direct-to-Rox flow, UNCHANGED.
  const payload = {
    rating: rating,
    domain: domain.toLowerCase(),
    rep: rep
  };
  if (test) payload.test = test;
  if (rating === 'dq_contact') {
    if (contactName) payload.contact_name = contactName;
    if (contactEmail) payload.contact_email = contactEmail;
    if (contactLinkedin) payload.contact_linkedin = contactLinkedin;
  }

  fetch(FEEDBACK_WEBHOOK_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify(payload)
  }).catch(function(){});

  renderFeedback(feedbackMessages[rating]);
}
// Otherwise: leave the default landing card in place.
</script>
</body>
</html>
