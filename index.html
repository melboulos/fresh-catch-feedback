<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎣 Fresh Catch — Feedback</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: #fafafa; color: #0f172a; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 24px; }
  .card { background: white; border: 1px solid #e2e8f0; border-radius: 12px; padding: 40px 32px; max-width: 480px; width: 100%; box-shadow: 0 10px 30px rgba(0,0,0,0.06); text-align: center; }
  .emoji { font-size: 56px; margin-bottom: 12px; }
  h1 { margin: 0 0 8px 0; font-size: 22px; font-weight: 700; }
  p { margin: 8px 0; font-size: 15px; color: #475569; line-height: 1.5; }
  .highlight { font-weight: 600; color: #0f172a; }
  .status { font-size: 13px; color: #94a3b8; margin-top: 20px; }
</style>
</head>
<body>
<div class="card">
  <div class="emoji" id="emoji">🎣</div>
  <h1 id="title">Fresh Catch feedback</h1>
  <p id="message">Click a feedback button in your daily Fresh Catch email to record a rating.</p>
  <p class="status" id="status"></p>
</div>
<script>
const WEBHOOK_URL = 'https://webhooks.backend.rox.com/webhooks/w/workflow-webhook-c952284c';
const validRatings = ['good','bad','opportunity','not_relevant','dq_contact'];
const messages = {
  good:         { emoji: '👍', title: 'Good account logged!', body: 'Fresh Catch will find more companies like <span class="highlight">DOMAIN</span>.' },
  opportunity:  { emoji: '🎯', title: 'Opportunity logged!',  body: 'Strongest positive signal we track. Nice work.' },
  not_relevant: { emoji: '🚫', title: 'Never suggest logged.', body: '<span class="highlight">DOMAIN</span> won\'t be suggested again.' },
  dq_contact:   { emoji: '👎', title: 'Contact DQ\'d.',        body: '<span class="highlight">CONTACT</span> at <span class="highlight">DOMAIN</span> is out of the call list. Account stays on future lists — we\'ll try different contacts.' },
  bad:          { emoji: '👎', title: 'Feedback logged.',      body: 'Legacy button (no effect on future picks).' }
};
const params = new URLSearchParams(window.location.search);
const rating = params.get('rating');
const domain = params.get('domain');
const rep = params.get('rep');
const contactName = params.get('contact_name') || '';
const contactEmail = params.get('contact_email') || '';
const contactLinkedin = params.get('contact_linkedin') || '';
if (rating && validRatings.includes(rating) && domain && rep) {
  const payload = { rating: rating, domain: domain, rep: rep };
  if (rating === 'dq_contact') {
    payload.contact_name = contactName;
    payload.contact_email = contactEmail;
    payload.contact_linkedin = contactLinkedin;
  }
  fetch(WEBHOOK_URL, { method: 'POST', mode: 'no-cors', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload) }).catch(function(){});
  const m = messages[rating];
  document.getElementById('emoji').textContent = m.emoji;
  document.getElementById('title').textContent = m.title;
  let bodyText = m.body.replace('DOMAIN', domain).replace('CONTACT', contactName);
  document.getElementById('message').innerHTML = bodyText;
  document.getElementById('status').textContent = 'You can close this tab.';
}
</script>
</body>
</html>
